name: 'SurgCore MCQ Validator'
description: 'Check CSV/JSON MCQ structure offline with the open-source Python CLI.'
author: 'SurgCore OSS Contributors'
inputs:
  file:
    description: 'Path to an authorized CSV or JSON question bank within the calling repository.'
    required: true
  mapping:
    description: 'Optional local JSON file mapping custom source headers to canonical MCQ fields.'
    required: false
    default: ''
  fail-on:
    description: 'error (default) or warning to fail on missing explanation/reference too.'
    required: false
    default: 'error'
  similarity:
    description: 'Heuristic near-duplicate threshold (0.80 to 1.00).'
    required: false
    default: '0.92'
  no-near-duplicates:
    description: 'Set true to disable heuristic near-duplicate stem checks.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install validator from action checkout
      shell: bash
      env:
        LOCAL_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$LOCAL_ACTION_PATH"
    - name: Validate question bank
      shell: bash
      env:
        MCQ_FILE: ${{ inputs.file }}
        MCQ_MAPPING: ${{ inputs.mapping }}
        MCQ_FAIL_ON: ${{ inputs.fail-on }}
        MCQ_SIMILARITY: ${{ inputs.similarity }}
        MCQ_SKIP_NEAR: ${{ inputs.no-near-duplicates }}
      run: |
        set -euo pipefail
        if [[ ! -f "$MCQ_FILE" ]]; then
          echo '::error::MCQ input file not found in calling repository.'
          exit 2
        fi
        args=(validate "$MCQ_FILE" --fail-on "$MCQ_FAIL_ON" --similarity "$MCQ_SIMILARITY")
        if [[ -n "$MCQ_MAPPING" ]]; then
          args+=(--mapping "$MCQ_MAPPING")
        fi
        if [[ "$MCQ_SKIP_NEAR" == 'true' ]]; then
          args+=(--no-near-duplicates)
        fi
        surgcore-mcq-validator "${args[@]}"
