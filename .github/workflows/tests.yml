name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify custom mapped synthetic sample
        env:
          PYTHONPATH: src
        run: python -m surgcore_mcq_validator validate examples/custom_schema.csv --mapping examples/column_mapping.json
      - name: Verify good synthetic sample
        env:
          PYTHONPATH: src
        run: python -m surgcore_mcq_validator validate examples/synthetic_questions.csv

  browser:
    name: Local browser validator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser-preview engine
        run: node --test demo/tests/browser-validator.test.cjs

  composite_action:
    name: Reusable GitHub Action smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate ordinary synthetic fixture through composite action
        uses: ./
        with:
          file: examples/synthetic_questions.csv
          fail-on: warning
      - name: Validate mapped synthetic fixture through composite action
        uses: ./
        with:
          file: examples/custom_schema.csv
          mapping: examples/column_mapping.json
          fail-on: warning
          no-near-duplicates: 'true'

  release:
    name: Publish verified versioned release
    needs: [tests, browser, composite_action]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Confirm release version
        id: version
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          with open('pyproject.toml', 'rb') as file:
              version = tomllib.load(file)['project']['version']
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) is None:
              raise SystemExit('A stable semver package version is required')
          tag = 'v' + version
          notes = Path('docs/releases') / (tag + '.md')
          if not notes.is_file():
              raise SystemExit(f'Missing reviewed release notes: {notes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as file:
              file.write('tag=' + tag + '\n')
              file.write('notes=' + str(notes) + '\n')
          PY
      - name: Check whether release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Release already exists; no new release created.'
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build versioned downloadable artifacts
        if: steps.release_check.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m zipfile -c "dist/surgcore-mcq-browser-demo-${TAG}.zip" demo/index.html demo/app.js demo/validator.js demo/styles.css demo/_headers demo/robots.txt demo/sitemap.xml
      - name: Publish verified release
        if: steps.release_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "SurgCore MCQ Validator $TAG" --notes-file "$NOTES"
