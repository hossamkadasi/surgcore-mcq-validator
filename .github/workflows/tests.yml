name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify custom mapped synthetic sample
        env:
          PYTHONPATH: src
        run: python -m surgcore_mcq_validator validate examples/custom_schema.csv --mapping examples/column_mapping.json
      - name: Verify good synthetic sample
        env:
          PYTHONPATH: src
        run: python -m surgcore_mcq_validator validate examples/synthetic_questions.csv
